{% extends "admin_panel/layouts/base.html" %}


{% block title %}
Delete Question
{% endblock %}



{% block content %}


<div class="max-w-xl mx-auto bg-white shadow rounded-xl p-8">


<h2 class="text-2xl font-bold text-red-600 mb-4">

Delete Question

</h2>


<p class="mb-6">

Are you sure you want to remove this question?

</p>


<p class="font-semibold mb-6">

{{ question.question.question }}

</p>



<form method="POST">

{% csrf_token %}



<button class="bg-red-600 text-white px-5 py-3 rounded-lg">

Delete

</button>



<a href="{% url 'exam_question_list' %}"
class="bg-gray-500 text-white px-5 py-3 rounded-lg ml-3">

Cancel

</a>


</form>



</div>


{% endblock %}
